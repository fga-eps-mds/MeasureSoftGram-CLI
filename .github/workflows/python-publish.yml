name: Publicar pacote

# Publicacao via Trusted Publishing (OIDC) - NAO usa token nem secret.
# Tudo no PyPI de producao, disparado por tags git:
#   tag vX.Y.ZrcN (pre-release, ex: v1.5.4rc1) -> publica como PRE-RELEASE no PyPI.
#       Pre-releases sao ignorados pelo `pip install` normal; so vem com
#       `pip install --pre` ou pin exato (==1.5.4rc1). Serve pra validar a versao
#       antes da final, sem afetar quem instala normalmente.
#   tag vX.Y.Z (versao final, ex: v1.5.4) -> publica a versao final, SOMENTE se ja
#       existir uma release candidate (vX.Y.ZrcN) da mesma versao no PyPI (trava
#       de seguranca: forca testar a rc antes da final).
#
# Passo a passo, configuracao do trusted publisher e como testar: ver PUBLISHING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build e validacoes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package: ${{ steps.meta.outputs.package }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de build
        run: python -m pip install --upgrade pip build packaging twine

      - name: Validar tag == versao do pyproject e detectar pre-release
        id: meta
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import Version

          ref = os.environ["GITHUB_REF_NAME"]          # ex: v1.5.4rc1
          tag_version = ref[1:] if ref.startswith("v") else ref

          with open("pyproject.toml", "rb") as f:
              proj = tomllib.load(f)["project"]
          pkg, pyproject_version = proj["name"], proj["version"]

          if Version(tag_version) != Version(pyproject_version):
              print(f"::error::A tag ({tag_version}) difere da versao em "
                    f"pyproject.toml ({pyproject_version}). Atualize a versao "
                    f"no pyproject antes de criar a tag.")
              sys.exit(1)

          is_pre = "true" if Version(tag_version).is_prerelease else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={tag_version}\n")
              out.write(f"package={pkg}\n")
              out.write(f"is_prerelease={is_pre}\n")
          print(f"OK: {pkg} {tag_version} (pre-release={is_pre})")
          PY

      - name: Build (sdist + wheel)
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Subir artefato
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-prerelease:
    name: Publicar pre-release (rc) no PyPI
    needs: build
    if: needs.build.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # obrigatorio para Trusted Publishing (OIDC)
    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar no PyPI (pre-release)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    name: Publicar versao final no PyPI
    needs: build
    if: needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # obrigatorio para Trusted Publishing (OIDC)
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate - exige release candidate da mesma versao publicada no PyPI
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --upgrade packaging
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from packaging.version import Version

          pkg = os.environ["PACKAGE"]
          base = Version(os.environ["VERSION"]).base_version   # ex: 1.5.4
          url = f"https://pypi.org/pypi/{pkg}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Nao foi possivel consultar o PyPI ({e.code}). "
                    f"Publique e teste a release candidate v{base}rc1 antes da "
                    f"versao final v{base}.")
              sys.exit(1)

          rcs = sorted(
              v for v in data.get("releases", {})
              if Version(v).base_version == base and Version(v).is_prerelease
          )
          if not rcs:
              print(f"::error::Gate bloqueou a publicacao da versao final: nenhuma "
                    f"release candidate de {base} encontrada no PyPI. Crie e teste "
                    f"a tag v{base}rc1 (pre-release) antes da final v{base}.")
              sys.exit(1)
          print(f"Gate ok: release candidate(s) no PyPI para {base}: {rcs}")
          PY

      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar no PyPI (versao final)
        uses: pypa/gh-action-pypi-publish@release/v1
