name: Rodar Testes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências de build e lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8 build tox
          pip install -r requirements.txt

      - name: Verificar Linter e Sintaxe
        run: |
          flake8 .
          python -m compileall .

      - name: Testar Empacotamento
        run: |
          python -m build

      - name: Rodar testes e gerar cobertura
        run: tox -e test_cli

      # O SonarCloud só deve ser executado se:
      # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
      # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
      - name: Scanner do SonarCloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true

      - name: Notificação de SonarCloud ignorado (Fork ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::notice title=SonarCloud Ignorado::O scan foi ignorado pois foi disparado pelo Dependabot ou originou-se de um fork externo sem acesso aos secrets de repositório."
