[pytest]
minversion = 6.0
addopts = -ra -q
testpaths =
    tests
markers =
    us(*ids): critérios de aceitação cobertos pelo teste, no formato USxx.yy-CAn (ex.: US01.01-CA3)
filterwarnings =
    # o id do critério vai para o junit.xml via record_property (o script de aceitação lê de lá)
    ignore:record_property is incompatible with junit_family:pytest.PytestWarning
